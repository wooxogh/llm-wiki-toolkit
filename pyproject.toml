[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.1.0"
description = "A local-first pipeline that turns a Markdown vault into memory an LLM agent can trust"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "numpy>=1.24", "rank-bm25>=0.2.2", "tqdm>=4.66"]

[project.optional-dependencies]
ml = ["torch>=2.2", "sentence-transformers>=3"]
dev = ["pytest>=8"]

[project.scripts]
wiki-init   = "llm_wiki.initialize:main"
wiki-index  = "llm_wiki.cli:index_main"
wiki-health = "llm_wiki.cli:health_main"
wiki-recall = "llm_wiki.cli:recall_main"
wiki-embed  = "llm_wiki.cli:embed_main"
wiki-eval   = "llm_wiki.cli:eval_main"
wiki-gate   = "llm_wiki.cli:gate_main"
wiki-lint   = "llm_wiki.cli:lint_main"
wiki-concepts = "llm_wiki.cli:concepts_main"
wiki-net = "llm_wiki.cli:net_main"
wiki-review = "llm_wiki.cli:review_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_wiki = ["evaluation/auto_thresholds.json", "hygiene/claim_lint/patterns/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["benchmarks/src"]
testpaths = ["tests", "benchmarks/tests"]
