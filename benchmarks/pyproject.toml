[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki-bench"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyarrow>=15"]
hoh = ["pyarrow>=15"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
