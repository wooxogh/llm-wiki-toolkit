name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m build
      - name: Verify wheel resources
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "llm_wiki_v3/assets/checkpoint.json",
              "llm_wiki_v3/assets/small_v3_50_normal.pt",
              "llm_wiki_v3/resources/llm-wiki-v3/SKILL.md",
          }
          missing = required - names
          assert not missing, f"wheel resources missing: {sorted(missing)}"
